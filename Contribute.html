<!DOCTYPE html>
<html>
<head>
    <title>Contribute - The Sabeen Mahmud Archive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Assets/Icons/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="landing-overlay" style="opacity: 1; display: grid;">
        <div id="submit-section" class="overlay-content" style="display:block">
            <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>
            <h3>Contribute to the Archive</h3>
            <form action="https://formspree.io/f/mbdddbqd" method="POST">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="_replyto" placeholder="Your Email" required>
            <textarea name="message" placeholder="How would you like to contribute..." required></textarea>
            <button type="submit">Send Message</button>
            </form>
        </div>
    </div>
</body>
</html>
