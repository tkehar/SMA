            <a-circle class="clickable" src="Assets/Icons/Exit_Room.png" rotation="0 90 0" position="-2 2.1 2.5" radius="0.1" material="transparent: true; opacity: 0.9; depthTest: false" color="#000000" onclick="switchRoom('cafe')" hover-info="title: Go to T2F Cafe"></a-circle>
        </a-entity>     

        <a-entity id="room-babybox" visible="false">
            <a-sky src="#bg-Baby_Box"></a-sky>

            <a-circle class="clickable" src="Assets/Icons/Flower.png" rotation="0 90 0" position="-2.5 1.5 -0.5" radius="0.15" material="shader: flat; transparent: true; opacity: 1; depthTest: false" onclick="interact('artefact_raggedy_ann')" hover-info="id: artefact_raggedy_ann" animation="property: scale; to: 1.2 1.2 1; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine"></a-circle>

            <a-circle class="clickable" src="Assets/Icons/Flower.png" rotation="0 90 0" position="-2.5 2.5 1.75" radius="0.15" material="shader: flat; transparent: true; opacity: 1; depthTest: false" onclick="interact('artefact_bean_on_tv_am')" hover-info="id: artefact_bean_on_tv_am" animation="property: scale; to: 1.2 1.2 1; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine"></a-circle>

            <a-circle class="clickable" src="Assets/Icons/Flower.png" rotation="0 90 0" position="0 -1.5 -1.5" radius="0.15" material="shader: flat; transparent: true; opacity: 1; depthTest: false" onclick="interact('artefact_flower_earrings')" hover-info="id: artefact_flower_earrings" animation="property: scale; to: 1.2 1.2 1; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine"></a-circle>

            <a-circle class="clickable" src="Assets/Icons/Flower.png" rotation="0 180 0" position="1 2.5 2" radius="0.15" material="shader: flat; transparent: true; opacity: 1; depthTest: false" onclick="interact('artefact_view_master')" hover-info="id: artefact_view_master" animation="property: scale; to: 1.2 1.2 1; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine"></a-circle>
            
            <a-circle class="clickable" src="Assets/Icons/Exit_Room.png" position="2 1 -2" radius="0.1" material="transparent: true; opacity: 0.9; depthTest: false" color="#000000" onclick="switchRoom('bedroom')" hover-info="title: Go to Sabeen's Bedroom"></a-circle>
        </a-entity>

        <a-entity id="room-gallery" visible="false">
            <a-sky src="#bg-T2F_Gallery"></a-sky>

            <a-circle class="clickable" src="Assets/Icons/Exit_Room.png" position="2 1 -2" radius="0.1" material="transparent: true; opacity: 0.9; depthTest: false" color="#000000" onclick="switchRoom('office')" hover-info="title: Go to Sabeen's Office"></a-circle>
        </a-entity>

        <a-entity id="room-cafe" visible="false">
            <a-sky src="#bg-T2F_Cafe"></a-sky>

            <a-circle class="clickable" src="Assets/Icons/Exit_Room.png" rotation="0 90 0" position="-3 2 4" radius="0.1" material="transparent: true; opacity: 0.9; depthTest: false" color="#000000" onclick="switchRoom('office')" hover-info="title: Go to Sabeen's Office"></a-circle>
        </a-entity>

        <a-entity id="rig">
            <a-entity id="main-camera" camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0">
                
                <!-- HUD Container -->
                <a-entity id="hud" position="0 0 -1">
                    
                    <!-- Navigation Menu (Left) -->
                    <a-entity id="nav-menu" position="0 -0.6 0" scale="0.3 0.3 0.3">
                        <!-- Background Panel -->
                        <a-plane color="#393939" opacity="0.8" width="2.2" height="0.6" position="0.1 0 -0.02" corner-radius="1"></a-plane>

                        <!-- Label -->
                        <a-text value="Currently in" align="left" position="-0.75 0.45 0.5" width="1.5" color="#FFFFFF"></a-text>
                        
                        <!-- Dropdown Header -->
                        <a-entity id="nav-header" position="-0.4 -0.05 0">
                            <a-plane class="clickable" color="#393939" width="1.0" height="0.25" onclick="toggleNavMenu()"></a-plane>
                            <a-text id="nav-current-room" value="Bedroom" align="left" position="-0.4 0 0.01" color="#FFFFFF" width="2.5"></a-text>
                            <a-image id="nav-arrow" class="clickable" onclick="toggleNavMenu()" src="Assets/Icons/Arrow_Down.png" color="#FFFFFF" width="0.125" height="0.125" position="0.4 0 0.01"></a-image>
                        </a-entity>
                        
                        <!-- Dropdown List -->
                        <a-entity id="nav-items-container" visible="false" position="-0.4 0.15 0">
                            <!-- Background -->
                            <a-plane color="#393939" opacity="0.9" width="1" height="0.9" position="0 0.69 0">
                            
                            <a-entity id="nav-items" position="0 0.49 0.01">
                                <a-entity class="nav-item" position="0 -0.15 0" data-room="bedroom">
                                    <a-plane class="clickable" width="1.0" height="0.2" color="#393939" onclick="switchRoom('bedroom')"></a-plane>
                                    <a-text value="Bedroom" align="left" position="-0.4 0 0" width="2.5"></a-text>
                                </a-entity>
                                <a-entity class="nav-item" position="0 -0.37 0" data-room="office">
                                    <a-plane class="clickable" width="1.0" height="0.2" color="#393939" onclick="switchRoom('office')"></a-plane>
                                    <a-text value="Office" align="left" position="-0.4 0 0" width="2.5"></a-text>
                                </a-entity>
                                <a-entity class="nav-item" position="0 -0.59 0" data-room="babybox">
                                    <a-plane class="clickable" width="1.0" height="0.2" color="#393939" onclick="switchRoom('babybox')"></a-plane>
                                    <a-text value="Baby Box" align="left" position="-0.4 0 0" width="2.5"></a-text>
                                </a-entity>
                                <a-entity class="nav-item" position="0 -0.81 0" data-room="cafe">
                                    <a-plane class="clickable" width="1.0" height="0.2" color="#393939" onclick="switchRoom('cafe')"></a-plane>
                                    <a-text value="Cafe" align="left" position="-0.4 0 0" width="2.5"></a-text>
                                </a-entity>
                            </a-entity>
                            </a-plane>
                        </a-entity>

                        <!-- Exit Button -->
                        <a-image id="nav-exit-icon" class="clickable" onclick="exitToHome()" src="Assets/Icons/Exit_Room.png" opacity="0.9" color="#FFFFF" width="0.3" height="0.3" position="0.5 0 0.01" hover-info="title: Exit Archive"></a-image>

                        <!-- Mute Button -->
                        <a-image id="nav-mute-icon" class="clickable" onclick="toggleGlobalAudio()" src="Assets/Icons/Unmute.png" opacity="0.9" color="#FFFFFF" width="0.3" height="0.3" position="1 0 0.01" hover-info="title: Mute/Unmute Audio"></a-image>
                    </a-entity>

                    <!-- Tooltip (Attached to Gaze) -->
                    <a-entity id="cursor-tooltip" visible="false" position="0 -0.25 0" scale="0.3 0.3 0.3">
                        <a-rounded id="tooltip-bg" 
                            width="1" height="0.4" 
                            radius="0.05" 
                            color="black" 
                            opacity="0.8">
                        </a-rounded>
                        <a-text id="tooltip-text" 
                            value="" 
                            align="center" 
                            color="#FFFFFF"
                            width="2.5" 
                            position="0 0.2 0.01">
                        </a-text>
                    </a-entity>

                    <!-- Info Panel (Attached to Gaze) -->
                    <a-entity id="info-panel" visible="false" scale="0.55 0.55 0.55" position="0 0.1 0">
                        <a-plane id="panel-bg" width="1.6" height="2.2" color="#1a1a1a" opacity="0.9"></a-plane>

                        <a-text id="panel-title" value="" position="-0.6 0.9 0.02" align="left" width="1.2" color="#f1c40f"></a-text>
                        <a-image id="panel-img" visible="false" position="0 0.3 0.02" width="1.2" height="1.5"></a-image>
                        <a-text id="panel-desc" value="" position="-0.6 0.2 0.02" align="left" width="1.2"></a-text>
                        <a-text id="panel-meta" value="" position="-0.6 0 0.02" align="left" width="1.2"></a-text>

                        <a-entity id="audio-player-ui" visible="false" position="0 -0.6 0.02">
                            <a-text id="audio-time" value="0:00 / 0:00" align="center" width="1.2" position="0 0.1 0" scale="0.8 0.8 0.8"></a-text>
                    
                            <a-circle id="play-pause-btn" class="clickable panel-button" src="Assets/Icons/Pause.png" position="0 -0.1 0.01" radius="0.1" material="transparent: true; shader: flat" onclick="togglePlayback()"></a-circle>
                        </a-entity>

                        <a-circle class="clickable panel-button" src="Assets/Icons/Cross Circle.png" position="0.6 0.9 0.05" radius="0.08" material="transparent: true; shader: flat" onclick="closePanel()"></a-circle>
                        <a-circle id="zoom-btn" class="clickable panel-button" position="0.6 0.7 0.05" radius="0.08" src="Assets/Icons/Zoom in.png" visible="false" material="transparent: true; shader: flat" onclick="toggleZoom()"></a-circle>
                    </a-entity>

                </a-entity>

            </a-entity>
            <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
        </a-entity>
        
        <!-- Global Background Audio: Adjust 'volume' (0 to 1) and 'src' here -->
        <a-entity id="global-audio" sound="src: #bg-music; autoplay: false; loop: true; volume: 0.25; positional: false"></a-entity>

        
    </a-scene>
    

    <script src="database.js"></script>
    <script src="scripts.js"></script>
    <script>
        var archiveScene = document.querySelector('a-scene');

        function onSceneLoaded() {
            // Remove hover functionality on mobile devices (excluding VR headsets)
            if (AFRAME.utils.device.isMobile() && !AFRAME.utils.device.isMobileVR()) {
                var hoverEls = document.querySelectorAll('[hover-info]');
                hoverEls.forEach(function(el) {
                    el.removeAttribute('hover-info');
                });
            }

            // Default to bedroom
            if (typeof switchRoom === "function") {
                switchRoom('bedroom'); 
            }
        }

        if (archiveScene.hasLoaded) {
            onSceneLoaded();
        } else {
            archiveScene.addEventListener('loaded', onSceneLoaded);
        }
    </script>
</body>
</html>
